<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="pigeonhole -- a wall of mail slots for coding agents running in parallel">
  <title>pigeonhole</title>
  <!-- No background rect: transparent, for a dark README background. -->

  <!-- Mark: 3x3 grid of open cubbies, stroked (not filled) so it reads as
       a wall of slots rather than a solid tile. Center slot holds a note. -->
  <g stroke="#f2e9d8" stroke-width="6" fill="none">
    <rect x="89"  y="73"  width="50" height="50" rx="4"/>
    <rect x="151" y="73"  width="50" height="50" rx="4"/>
    <rect x="213" y="73"  width="50" height="50" rx="4"/>
    <rect x="89"  y="135" width="50" height="50" rx="4"/>
    <rect x="151" y="135" width="50" height="50" rx="4"/>
    <rect x="213" y="135" width="50" height="50" rx="4"/>
    <rect x="89"  y="197" width="50" height="50" rx="4"/>
    <rect x="151" y="197" width="50" height="50" rx="4"/>
    <rect x="213" y="197" width="50" height="50" rx="4"/>
  </g>
  <rect x="161" y="125" width="30" height="14" rx="2" fill="#d9642c"/>

  <!-- Wordmark, composed to the right of and level with the mark. -->
  <text x="340" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="100" letter-spacing="-2" fill="#f2e9d8">pigeonhole</text>

  <!-- Tagline, preceded by an accent square echoing the note in the mark. -->
  <rect x="342" y="232" width="14" height="14" fill="#d9642c"/>
  <text x="366" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#f2e9d8" fill-opacity="0.72">A wall of mail slots for coding agents running in parallel</text>
</svg>
